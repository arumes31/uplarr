name: GHCR cleanup
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report candidates without deleting images
        type: boolean
        default: true
        required: true
permissions:
  contents: read
concurrency:
  group: ghcr-retention
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - name: Prune only old unreferenced untagged manifests
        # v3.1 preserves platform/SBOM/provenance children of retained OCI indexes.
        # Tagged versions and commit tags remain available for rollback.
        uses: docker://ghcr.io/snok/container-retention-policy@sha256:884037f146d6ef574b61fbcc59bef490f887322e6b9dc2eefcf364cb4e9b4112
        with:
          args: >-
            --account=user
            --token=${{ secrets.GITHUB_TOKEN }}
            --image-names=${{ github.event.repository.name }}
            --tag-selection=untagged
            --timestamp-to-use=updated_at
            --cut-off=30d
            --dry-run=${{ inputs.dry_run }}
        env:
          RUST_LOG: container_retention_policy=INFO

  cleanup-releases:
    if: ${{ !inputs.dry_run }}
    name: Cleanup Old Releases
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Delete older releases
        uses: dev-drprasad/delete-older-releases@dfbe6be2a006e9475dfcbe5b8d201f1824c2a9fe # v0.3.4
        with:
          keep_latest: 5
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cleanup-workflow-runs:
    if: ${{ !inputs.dry_run }}
    name: Cleanup Workflow Runs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@b3018382ca039b53d238908238bd35d1fb14f8ee # v2.1.0
        with:
          repository: ${{ github.repository }}
          retain_days: 30
          keep_minimum_runs: 5
